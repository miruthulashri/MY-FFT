<html>
<head>
    <title>Chess Board Game</title>

    <style>
        body {
            background: linear-gradient(135deg, #f5e6d3, #d7ccc8);
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #2c1b18;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px #aaa;
        }

        .board {
            width: 800px;
            max-width: 90vw;
            margin: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border: 8px solid #4b2e20;
            border-radius: 12px;
            background-color: #4b2e20;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .square {
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(28px, 5vw, 48px);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .black {
            background-color: #3b302b;
            color: white;
        }

        .white {
            background-color: #f1e7d0;
            color: black;
        }

        .square:hover {
            transform: scale(1.05);
            box-shadow: inset 0 0 0 4px #d4af37;
            z-index: 2;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 24px;
                letter-spacing: 2px;
            }

            .board {
                border-width: 5px;
                padding: 5px;
            }
        }
    </style>
</head>

<body>

    <h1>Chess Board Game</h1>

    <div class="board">

        <!-- Row 1 -->
        <div class="square black">♜</div>
        <div class="square white">♞</div>
        <div class="square black">♝</div>
        <div class="square white">♛</div>
        <div class="square black">♚</div>
        <div class="square white">♝</div>
        <div class="square black">♞</div>
        <div class="square white">♜</div>

        <!-- Row 2 -->
        <div class="square white">♟</div>
        <div class="square black">♟</div>
        <div class="square white">♟</div>
        <div class="square black">♟</div>
        <div class="square white">♟</div>
        <div class="square black">♟</div>
        <div class="square white">♟</div>
        <div class="square black">♟</div>

        <!-- Row 3 -->
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>

        <!-- Row 4 -->
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>

        <!-- Row 5 -->
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>

        <!-- Row 6 -->
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>

        <!-- Row 7 -->
        <div class="square black">♙</div>
        <div class="square white">♙</div>
        <div class="square black">♙</div>
        <div class="square white">♙</div>
        <div class="square black">♙</div>
        <div class="square white">♙</div>
        <div class="square black">♙</div>
        <div class="square white">♙</div>

        <!-- Row 8 -->
        <div class="square white">♖</div>
        <div class="square black">♘</div>
        <div class="square white">♗</div>
        <div class="square black">♕</div>
        <div class="square white">♔</div>
        <div class="square black">♗</div>
        <div class="square white">♘</div>
        <div class="square black">♖</div>

    </div>

</body>
</html>
