<html>
<head>
    <title>Grade Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .box {
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            text-align: center;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 7px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            background-color: #5b2c83;
            color: white;
            border: none;
        }

        #result {
            line-height: 1.8;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Grade Calculator</h1>

        <input type="text" id="name" placeholder="Student Name">

        <input type="number" id="m1" placeholder="Subject 1 Marks">

        <input type="number" id="m2" placeholder="Subject 2 Marks">

        <input type="number" id="m3" placeholder="Subject 3 Marks">

        <input type="number" id="m4" placeholder="Subject 4 Marks">

        <button onclick="calculate()">Calculate</button>

        <button onclick="reset()">Reset</button>

        <p id="result"></p>

    </div>

    <script>
        function calculate() {

            let name = document.getElementById("name").value;
            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);
            let m4 = Number(document.getElementById("m4").value);

            if (name == "" || m1 < 0 || m1 > 100 ||
                m2 < 0 || m2 > 100 ||
                m3 < 0 || m3 > 100 ||
                m4 < 0 || m4 > 100) {

                alert("Please enter valid details");
                return;
            }

            let total = m1 + m2 + m3 + m4;

            let average = total / 4;

            let percentage = total / 4;

            let grade;

            if (percentage >= 90) {
                grade = "A";
            }
            else if (percentage >= 80) {
                grade = "B";
            }
            else if (percentage >= 70) {
                grade = "C";
            }
            else if (percentage >= 60) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            let status;

            if (percentage >= 40) {
                status = "Pass";
            }
            else {
                status = "Fail";
            }

            document.getElementById("result").innerHTML =
                "Name: " + name +
                "<br>Total Marks: " + total +
                "<br>Average: " + average +
                "<br>Percentage: " + percentage + "%" +
                "<br>Grade: " + grade +
                "<br>Result: " + status;
        }

        function reset() {

            document.getElementById("name").value = "";
            document.getElementById("m1").value = "";
            document.getElementById("m2").value = "";
            document.getElementById("m3").value = "";
            document.getElementById("m4").value = "";

            document.getElementById("result").innerHTML = "";
        }
    </script>

</body>
</html>
